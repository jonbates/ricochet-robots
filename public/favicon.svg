<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a1a2a" />
  <!-- three stacked rounded segments, mimicking a ricocheting robot's body -->
  <ellipse cx="32" cy="49" rx="19" ry="12" fill="#2f8fdc" />
  <circle cx="32" cy="32" r="13" fill="#57a8e6" />
  <circle cx="32" cy="16" r="8" fill="#8ec7f0" />
  <!-- a small darker dome highlight on top, echoing the in-game robot pieces -->
  <circle cx="32" cy="14" r="3.4" fill="#2f8fdc" />
</svg>
